<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: 전체 화면 캔버스 바다(카테고리 = 수심층) + 상단 수심 HUD + 하단 기업 카드 시트. 심해 단일 테마 */
:root{
  --abyss:#04111c; --deep:#0a2a3f; --foam:#e6f6f7;
  --glow:#7ff0d6; --coral:#ff9a76; --ink:#06202e; --muted:#9cc3cc;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--abyss);color:var(--foam);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.gauge{background:rgba(4,17,28,.6);border:1px solid rgba(127,240,214,.25);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);min-width:0}
.gauge small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.gauge b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--glow)}
.gauge b span{font-size:14px;color:var(--muted);margin-left:2px}
.gauge .zone{font-size:12px;color:var(--foam);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.gauge.mini{padding:5px 10px;border-radius:8px}
.gauge.mini small{white-space:nowrap}
.hud .right{flex-shrink:0}
/* 멀리 보기일 때 왼쪽 위 계기판·버튼을 작게 */
body.ov .left>.gauge{padding:5px 10px;border-radius:8px}
body.ov .left>.gauge small{font-size:10px}
body.ov .left>.gauge b{font-size:18px}
body.ov .left>.gauge b span{font-size:11px}
body.ov .left>.gauge .zone{font-size:11px;margin-top:1px}
body.ov .btns{gap:4px}
body.ov .btns .hudBtn,body.ov .btns #filterChip{padding:4px 10px;font-size:11.5px}
.gauge.mini small{font-size:10px}
.gauge.mini b{font-size:18px}
.gauge.mini b span{font-size:11px}
.left{display:flex;align-items:stretch;gap:8px;min-width:0}
.btns{display:grid;grid-template-columns:repeat(2,auto);align-content:space-between;justify-items:start;gap:6px;pointer-events:auto}
.live b{color:#ff9a76}
body.ov #liveG,body.ov #visitG{display:none!important}
.btns .hudBtn,.btns #filterChip{padding:7px 12px;font-size:13px;white-space:nowrap}
.hudBtn{pointer-events:auto;background:rgba(4,17,28,.6);color:var(--foam);border:1px solid rgba(127,240,214,.35);padding:8px 14px;font-size:13px}
.hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);background:rgba(4,17,28,.6);padding:6px 14px;border-radius:99px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:opacity .4s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(29,111,143,.35),rgba(4,17,28,.88))}
#start h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,72px);line-height:1;margin:0;text-wrap:balance}
#start p{margin:0;max-width:30em;color:var(--muted);line-height:1.6}
#start .meta{font-size:12px;letter-spacing:.08em;color:var(--glow)}
button,.visit{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:12px 26px;font-weight:600;font-size:15px}
#go{background:var(--glow);color:var(--ink)}
button:focus-visible,.visit:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(10,42,63,.97),rgba(4,17,28,.99));border-top:1px solid rgba(127,240,214,.35);border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:64px 1fr;gap:12px 16px;align-items:center}
.logo{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;overflow:hidden;font-size:34px}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px;box-sizing:border-box}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.sheet .tag{font-size:12px;color:var(--glow);letter-spacing:.04em}
.sheet .sec{grid-column:1/-1;min-width:0}
.sheet .sec small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.sheet .sec p{margin:0;line-height:1.65;color:#cfe6ea}
.acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.visit{background:var(--coral);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.nolink{font-size:13px;color:var(--muted)}
.ghost{background:transparent;color:var(--muted);border:1px solid rgba(156,195,204,.4)}
.list{max-width:820px;margin:0 auto}
.list h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px}
.list h3{font-size:12px;letter-spacing:.06em;margin:16px 0 6px;font-weight:600}
.list ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.list li button{width:100%;text-align:left;background:rgba(230,246,247,.06);color:var(--foam);border-radius:10px;padding:9px 10px;font-weight:400;font-size:14px;display:flex;gap:6px;align-items:center}
.list li button.seen{color:var(--glow)}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.listIntro{margin:2px 0 12px;color:var(--muted);font-size:13px;line-height:1.55}
.search{display:block;margin:0 0 4px}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid rgba(156,195,204,.35);background:rgba(230,246,247,.07);color:var(--foam)}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:2px solid var(--glow);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:20;background:var(--glow);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.count{margin:12px 0 0;font-size:12px;color:var(--muted)}
.cos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.co{background:rgba(230,246,247,.06);border-radius:14px;padding:12px;display:grid;grid-template-columns:52px 1fr;gap:8px 12px;align-items:start;min-width:0}
.co .lg{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:26px;overflow:hidden;background:#fff}
.co .lg img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box}
.co h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.co h4 .seenMark{color:var(--glow);font-size:12px;font-weight:400;margin-left:4px}
.co .cat{font-size:11.5px;margin-top:2px}
.co .chips{margin-top:5px}
.co p{grid-column:1/-1;margin:0;font-size:13px;line-height:1.6;color:#cfe6ea;min-width:0;overflow-wrap:anywhere}
.co .acts{grid-column:1/-1;gap:6px}
.co .visit{padding:7px 14px;font-size:13px}
.co .find{padding:7px 14px;font-size:13px}
.co .nolink{font-size:12px}
.hudBtn[aria-pressed="true"]{background:var(--glow);color:var(--ink)}
.seeAll{width:100%;margin-top:12px;background:var(--glow);color:var(--ink)}
.tabs{display:flex;gap:4px;margin:12px 0 4px;background:rgba(230,246,247,.06);border-radius:99px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:9px 10px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--glow);color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.picks button{border-radius:12px;padding:12px 8px;background:rgba(230,246,247,.06);color:var(--foam);border:1px solid transparent;display:flex;flex-direction:column;gap:2px;align-items:center}
.picks button b{font-family:var(--display);font-weight:400;font-size:20px}
.picks button span{font-size:12px;color:var(--muted);font-weight:400}
.picks button[aria-pressed="true"]{border-color:currentColor;background:rgba(230,246,247,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
#filterChip{pointer-events:auto;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid currentColor;background:rgba(4,17,28,.7)}
.empty{color:var(--muted);font-size:14px;margin:16px 0 0}
.talk{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 30px rgba(4,17,28,.35);text-align:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1) .4s both;z-index:5}
.talk::after{content:"";position:absolute;left:calc(50% + var(--tail,0px));bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.talk p{margin:0 0 12px;font-family:var(--display);font-size:clamp(16px,4.8vw,20px);line-height:1.35}
#diveBtn{background:var(--coral);color:var(--ink);padding:10px 30px;font-size:16px;box-shadow:0 4px 0 #c9583d}
#diveBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9583d}
@keyframes pop{from{opacity:0;transform:translate(-50%,12px) scale(.7)}}
.pad{}
#pad{position:fixed;left:50%;top:80%;width:88px;height:88px;margin:-44px 0 0 -44px;touch-action:none;z-index:4;user-select:none;-webkit-user-select:none}
#pad .padRing{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(4,17,28,.15) 30%,rgba(4,17,28,.42) 70%);border:2px solid rgba(127,240,214,.45);box-shadow:0 0 18px rgba(127,240,214,.25) inset,0 0 14px rgba(127,240,214,.18);backdrop-filter:blur(2px)}
#pad .ar{position:absolute;font-size:9px;color:rgba(230,246,247,.75);line-height:1;pointer-events:none}
#pad .up{left:50%;top:6px;transform:translateX(-50%)}#pad .dn{left:50%;bottom:6px;transform:translateX(-50%)}
#pad .lf{top:50%;left:7px;transform:translateY(-50%)}#pad .rt{top:50%;right:7px;transform:translateY(-50%)}
#knob{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6fff5,#7ff0d6 45%,#2fb79c);box-shadow:0 0 16px rgba(127,240,214,.6),0 3px 8px rgba(0,0,0,.35);pointer-events:none}
#pad.on .padRing{border-color:rgba(127,240,214,.85)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.talk{animation:none}}
</style>
</head>
<body>

<a href="#" class="skip" id="skipList">기업 목록을 글로 보기</a>
<canvas id="sea" role="img" aria-label="바다 속을 다이버가 헤엄치며 2026 문화기술 참여기업 31개사를 만나는 화면. 기업 정보는 '기업 목록' 버튼에서 글로 볼 수 있어요."></canvas>

<div class="hud" aria-live="polite">
  <div class="left">
    <div class="gauge"><small id="depthLbl">수심</small><b id="depth">0.0<span>m</span></b><div class="zone" id="zone">수면</div></div>

      <button id="filterChip" type="button" hidden></button>

  </div>
  <div class="right">
    <div class="gauge mini" style="text-align:right"><small>만난 기업</small><b id="found">0<span id="total">/0</span></b></div>

</div>
<div id="pad" role="group" aria-label="방향 조작" hidden>
  <div class="padRing"></div>

</div>

<div id="talk" class="talk"><p>'26년 문화기술 산업육성 사업<br>지원기업의 바다로 빠져볼까?'</p><button id="diveBtn" type="button">다이브!</button></div>

<div class="sheet" id="sheet" role="dialog" aria-label="기업 소개">
  <div class="sheet-in">
    <div class="logo" id="sLogo"></div>
    <div style="min-width:0"><div class="tag" id="sTag"></div><h2 id="sName"></h2><div class="chips" id="sProg"></div></div>
    <div class="sec"><small>사업 소개</small><p id="sDesc"></p></div>
    <div class="acts">
      <a class="visit" id="sLink" href="#" target="_blank" rel="noopener">홈페이지 방문 ↗</a>
      <span class="nolink" id="sNo" hidden>등록된 홈페이지가 없어요</span>
      <button class="ghost" id="close" type="button">계속 잠수하기</button>
    </div>
  </div>
</div>

<div class="sheet" id="listSheet" role="dialog" aria-modal="true" aria-labelledby="listTitle">
  <div class="list">
    <div class="row"><h2 id="listTitle">기업 목록</h2><button class="ghost" id="listClose" type="button">닫기</button></div>
    <p class="listIntro">2026 경기도 문화기술 산업육성 사업 참여기업 31개사를 글로 정리한 목록이에요. 홈페이지로 바로 가거나, 바다에서 기업을 찾아갈 수 있어요.</p>
    <label class="search" for="q"><span class="sr">기업 검색</span><input id="q" type="search" placeholder="기업명이나 키워드로 찾기 (예: XR, 애니메이션)" autocomplete="off"></label>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabZone" data-tab="zone">분야별 수심</button>
      <button type="button" role="tab" id="tabProg" data-tab="prog">지원사업별</button>
    </div>
    <div id="progPick" class="picks" hidden></div>
    <button id="seeAll" class="seeAll" type="button">바다에서 전체 한꺼번에 보기</button>
    <p class="count" id="listCount" aria-live="polite"></p>
    <div id="listBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 구형 브라우저 보완: iOS 16 미만 Safari 등에는 둥근 사각형 그리기와 Array.at 이 없음 */
if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));

/* 터치·마우스: 한 손가락 = 헤엄/터치, 두 손가락 = 확대·축소 */
const ptrs=new Map();let pinch=null,downInfo=null,userZ=1;
const clampZ=z=>Math.max(.22,Math.min(1.8,z));
const pdist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
function zoomBy(f){
  if(overview){if(f>1.02){userZ=.45;setOverview(false)}return}
  userZ=clampZ(userZ*f);
}
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(phase!=='swim'||sheetOpen)return;
  if(ptrs.size===2){pinch={d0:pdist(),z0:userZ,ov:overview};holding=false;target=null;fast=false;downInfo=null;return}
  if(ptrs.size>2)return;
  const p=pickP(e);
  if(bk.on&&!overview&&Math.hypot(e.clientX-bk.sx,e.clientY-bk.sy)<Math.max(40,90*bk.sk)){bk.say=2.8;downInfo=null;return}
  const c=mode3&&!overview?hit3(e.clientX,e.clientY):hitCompany(p);
  downInfo={x:e.clientX,y:e.clientY,c};
  if(overview)return; // 멀리 보기에서는 손을 뗄 때 처리 (두 손가락 확대와 구분)
  if(c&&near(c))return; // 손을 뗄 때 카드 열기
  fast=false;holding=true;target=c?approach(c):p;
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const r=pdist()/Math.max(20,pinch.d0);
    if(pinch.ov){if(r>1.25){pinch.ov=false;pinch.d0=pdist();pinch.z0=.45;userZ=.45;setOverview(false)}return}
    userZ=clampZ(pinch.z0*r);return}
  if(holding&&!overview)target=pickP(e);
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2){pinch=null;downInfo=null}holding=false;return}
  holding=false;
  const d=downInfo;downInfo=null;
  if(!d||phase!=='swim'||sheetOpen||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12)return;
  if(overview){let lh=null;if(labelHits.length&&e.clientX>=labelHits[0].x-24){let best=1e9;labelHits.forEach(h=>{const dy=Math.abs(e.clientY-(h.y+h.h/2));if(dy<best){best=dy;lh=h}});if(best>22)lh=null}
    const cc=lh?lh.c:d.c;if(lh){pickFlash={c:lh.c,t:.6}}
    setOverview(false);if(cc){fast=true;target=approach(cc)}return}
  if(d.c&&near(d.c))openCompany(d.c);
}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);

const matchQ=c=>{if(!query)return true;const q=query.toLowerCase();return [c.name,c.desc,ZONES[c.z].name,...c.p.map(i=>PROGRAMS[i].name)].some(v=>v.toLowerCase().includes(q))};
function coCard(c,i){
  const logo=c.logo?`<img src="${c.logo}" alt="${esc(c.name)} 로고">`:`<span aria-hidden="true">${c.e}</span>`;
  const chips=c.p.map(k=>`<span class="chip" style="color:${PROGRAMS[k].color}">${PROGRAMS[k].name}</span>`).join('');

  return `<li class="co"><div class="lg" style="${c.logo?'':'background:'+c.color}">${logo}</div>

function zoneLists(pred){let n=0;
  const html=ZONES.map((z,zi)=>{const items=COMPANIES.map((c,i)=>c.z===zi&&pred(c)&&matchQ(c)?(n++,coCard(c,i)):'').join('');
    return items?`<h3 style="color:${z.color}">${Math.round((z.top-SURFACE)/PX_PER_M)}m · ${esc(z.name)}</h3><ul class="cos">${items}</ul>`:''}).join('');

const baseZoom=()=>W<480?.74:W<800?.86:1; // 폰에서는 한 단계 멀리서 봄
function zoneAt(yy){if(yy<SURFACE)return'수면';const z=ZONES.find(z=>yy>=z.top&&yy<z.bottom);return z?z.name:(yy<ZONES[0].top?'얕은 바다':'해저')}

function update(dt){
  diver.t+=dt;updateFx(dt);if(!stepPhase(dt)){let ax=0,ay=0;
  if(keys.ArrowLeft||keys.a)ax-=1;if(keys.ArrowRight||keys.d)ax+=1;
  {const u=mode3&&!overview?1:-1;if(keys.ArrowUp||keys.w)ay+=u;if(keys.ArrowDown||keys.s)ay-=u;if(padVec&&!sheetOpen){ax+=padVec.x;ay+=u*padVec.f}}
  if(ax||ay){target=null;fast=false;if(overview)setOverview(false)}
  if(target&&!ax&&!ay&&!sheetOpen){
    // 도착 감속: 남은 거리에 비례해 속도를 줄여 찍은 자리에 정확히 멈춤
    const tx=Math.max(40,Math.min(WORLD_W-40,target.x)),ty=Math.max(SURFACE-24,Math.min(WORLD_H-130,target.y));
    const dx=tx-diver.x,dy=ty-diver.y,d=Math.hypot(dx,dy);
    if(d<2.5&&!holding){diver.x=tx;diver.y=ty;diver.vx=diver.vy=0;target=null;fast=false}
    else{const sp=Math.min(fast?1100:420,d*4.5),k=Math.min(1,dt*9);
      diver.vx+=((d?dx/d*sp:0)-diver.vx)*k;diver.vy+=((d?dy/d*sp:0)-diver.vy)*k}}
  else{const acc=sheetOpen?0:950;
    diver.vx+=ax*acc*dt;diver.vy+=ay*acc*dt;
    diver.vx*=Math.pow(.12,dt);diver.vy*=Math.pow(.12,dt)}
  diver.x=Math.max(40,Math.min(WORLD_W-40,diver.x+diver.vx*dt));
  diver.y=Math.max(mode3?SURFACE+150:SURFACE-24,Math.min(WORLD_H-130,diver.y+diver.vy*dt));
  if(Math.abs(diver.vx)>8)diver.face=diver.vx>0?1:-1;}
  if(diver.y>SURFACE&&Math.random()<dt*2.2)bubbles.push({x:diver.x+diver.face*14,y:diver.y-18,r:2+Math.random()*3,v:40+Math.random()*30});
  bubbles.forEach(b=>{b.y-=b.v*dt;b.x+=Math.sin(b.y*.05)*.3});
  for(let i=bubbles.length-1;i>=0;i--)if(bubbles[i].y<SURFACE||bubbles[i].y<diver.y-900)bubbles.splice(i,1);
  COMPANIES.forEach(c=>{c.ph+=dt*.8;c.x=c.bx+Math.sin(c.ph*.7)*24;c.y=c.by+Math.sin(c.ph)*16});
  updateBukang(dt);update3(dt);updateMulti(dt);
  updateDepth(dt);
  creatures.forEach(c=>{c.ph+=dt;c.x+=c.v*dt;
    if(c.type==='jelly'){c.y+=Math.sin(c.ph*.8)*10*dt-4*dt;if(c.y<SURFACE+80)c.y=WORLD_H-200}
    if(c.type==='octopus'||c.type==='seahorse')c.y+=Math.sin(c.ph*1.1)*12*dt;
    if(c.type==='squid')c.x+=c.v*dt*2.5*Math.pow(Math.max(0,Math.sin(c.ph*1.6)),4);
    if(c.type==='shrimp'&&Math.sin(c.ph*.9)>.97)c.x+=c.v*dt*6;
    if(c.x<-500)c.x=WORLD_W+500;if(c.x>WORLD_W+500)c.x=-500});
  // 카메라: 멀리 보기면 보이는 기업 전체가 들어오게, 아니면 다이버를 따라감
  const BASE=baseZoom()*(phase==='swim'?userZ:1);let tS=BASE,tx=diver.x,ty=diver.y+H*.05;
  if(phase==='boat'&&!overview){tS=Math.min(1.6,(W-32)/390);tx=BX+12;ty=(SURFACE-104)-(.24*H)/tS}
  if(overview){const vs=COMPANIES.filter(visible);
    const x0=Math.min(...vs.map(c=>c.bx))-150,x1=Math.max(...vs.map(c=>c.bx))+130,y0=Math.min(...vs.map(c=>c.by))-150,y1=Math.max(...vs.map(c=>c.by))+110;
    const lw=labelW(),aw=W-lw-28;tS=Math.max(.05,Math.min(1,aw/(x1-x0),(H-150)/(y1-y0)));tx=(x0+x1)/2+(lw+28)/2/tS;ty=(y0+y1)/2-40/tS;ov={S:tS,y:ty-H/tS/2}}
  const k=Math.min(1,dt*(fast||overview?5:4));
  S+=(tS-S)*Math.min(1,dt*4);camC.x+=(tx-camC.x)*k;camC.y+=(ty-camC.y)*k;
  const vw=W/S,vh=H/S;
  cam.x=overview||S<baseZoom()-.02?camC.x-vw/2:(vw>=WORLD_W?(WORLD_W-vw)/2:Math.max(0,Math.min(WORLD_W-vw,camC.x-vw/2)));
  cam.y=vh>=WORLD_H?(WORLD_H-vh)/2:Math.max(0,Math.min(WORLD_H-vh,camC.y-vh/2));
  {const m3=mode3&&!overview;const lb=m3?'이동 거리':'수심';if($('depthLbl').textContent!==lb)$('depthLbl').textContent=lb;
   $('depth').firstChild.nodeValue=Math.max(0,(diver.y-(m3?SURFACE+300:SURFACE))/PX_PER_M).toFixed(1)}
  const zn=overview?(filter===null?'전체 기업 보기':PROGRAMS[filter].name+' 기업 보기'):zoneAt(diver.y);if($('zone').textContent!==zn)$('zone').textContent=zn;
}

/* ── 생물 그리기 (오른쪽을 보는 기준, 원점 중심) ── */
function drawShark(t,ph){const sw=Math.sin(t*3+ph)*.22;
  ctx.beginPath();ctx.moveTo(70,0);ctx.quadraticCurveTo(40,-20,-10,-17);ctx.quadraticCurveTo(-40,-12,-60,-3);ctx.lineTo(-60,3);ctx.quadraticCurveTo(-30,14,10,14);ctx.quadraticCurveTo(50,12,70,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(8,-16);ctx.lineTo(-6,-44);ctx.lineTo(-22,-15);ctx.fill();
  ctx.beginPath();ctx.moveTo(18,10);ctx.lineTo(-4,32);ctx.lineTo(-6,12);ctx.fill();
  ctx.save();ctx.translate(-58,0);ctx.rotate(sw);ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(-26,-34);ctx.lineTo(-16,0);ctx.lineTo(-24,22);ctx.lineTo(0,3);ctx.fill();ctx.restore()}
function drawWhale(t,ph){const fl=Math.sin(t*1.2+ph)*.35;
  ctx.beginPath();ctx.moveTo(150,10);ctx.bezierCurveTo(150,-45,60,-62,-20,-48);ctx.bezierCurveTo(-90,-36,-150,-14,-190,-4);ctx.lineTo(-190,6);ctx.bezierCurveTo(-130,24,-40,48,40,46);ctx.bezierCurveTo(110,44,150,40,150,10);ctx.fill();
  ctx.save();ctx.translate(40,30);ctx.rotate(.6+fl*.4);ctx.beginPath();ctx.ellipse(0,26,12,40,0,0,6.28);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(-188,0);ctx.rotate(fl);ctx.beginPath();ctx.moveTo(0,-5);ctx.bezierCurveTo(-20,-10,-40,-40,-62,-34);ctx.quadraticCurveTo(-40,-8,-30,0);ctx.quadraticCurveTo(-40,8,-62,34);ctx.bezierCurveTo(-40,40,-20,10,0,5);ctx.fill();ctx.restore();
  ctx.save();ctx.globalAlpha*=.35;ctx.strokeStyle='#000';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(130-i*4,22+i*4);ctx.lineTo(20-i*12,40+i*1.5);ctx.stroke()}ctx.restore()}
function drawManta(t,ph){const f=Math.sin(t*1.6+ph);
  ctx.save();ctx.scale(1,1);ctx.beginPath();ctx.moveTo(40,0);ctx.quadraticCurveTo(10,-20*f-8,-20,-70*(.6+.4*f));ctx.quadraticCurveTo(-10,-20,-35,0);ctx.quadraticCurveTo(-10,20,-20,70*(.6+.4*f));ctx.quadraticCurveTo(10,20*f+8,40,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(40,-6);ctx.lineTo(52,-12);ctx.lineTo(44,0);ctx.lineTo(52,12);ctx.lineTo(40,6);ctx.fill();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-34,0);ctx.quadraticCurveTo(-70,Math.sin(t*2+ph)*10,-110,0);ctx.strokeStyle=ctx.fillStyle;ctx.stroke();ctx.restore()}
function drawTurtle(t,ph){const p=Math.sin(t*2+ph);
  ctx.save();ctx.translate(18,-6);ctx.rotate(-.5+p*.5);ctx.beginPath();ctx.ellipse(0,-14,7,20,0,0,6.28);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(18,6);ctx.rotate(.5-p*.5);ctx.beginPath();ctx.ellipse(0,14,7,20,0,0,6.28);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(-20,0);ctx.rotate(p*.3);ctx.beginPath();ctx.ellipse(-6,-10,5,10,.6,0,6.28);ctx.ellipse(-6,10,5,10,-.6,0,6.28);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.ellipse(40,0,9,7,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,32,22,0,0,6.28);ctx.fill();
  ctx.save();ctx.globalAlpha*=.3;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(18,0);ctx.moveTo(-8,-18);ctx.lineTo(-8,18);ctx.moveTo(8,-18);ctx.lineTo(8,18);ctx.stroke();ctx.restore()}
function drawFish(t,ph,len){const w=Math.sin(t*10+ph)*.35;
  ctx.beginPath();ctx.ellipse(0,0,len,len*.38,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(-len*.85,0);ctx.rotate(w);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-len*.7,-len*.45);ctx.lineTo(-len*.7,len*.45);ctx.fill();ctx.restore()}
function drawJelly(t,ph,c){const pulse=1+Math.sin(t*2.4+ph)*.12;
  ctx.save();ctx.scale(pulse,2-pulse);ctx.beginPath();ctx.arc(0,0,22,Math.PI,0);ctx.quadraticCurveTo(0,8,-22,0);ctx.fill();ctx.restore();
  ctx.strokeStyle=c;ctx.lineWidth=1.5;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*8,4);for(let s=1;s<=5;s++)ctx.lineTo(k*8+Math.sin(t*2+k+s+ph)*5,4+s*12);ctx.stroke()}}

function gfill(c1,c2,r){const g=ctx.createRadialGradient(-r*.35,-r*.4,1,0,0,r*1.2);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}

    ctx.beginPath();ctx.moveTo(bx,6);for(let s=1;s<=6;s++){const w=Math.sin(t*2.2+ph+k*.8+s*.7)*(3+s*1.2);ctx.lineTo(bx+(k-3.5)*s*1.3+w,6+s*5.5)}ctx.stroke()}

/* ── 흑상어: 9초마다 화면을 가로질러 지나감, 누르면 말풍선 ── */
const bk={on:false,p:0,timer:3,dir:1,yf:.5,sx:-1e4,sy:-1e4,sk:1,say:0,X3:0,Y3:0,Z3:0};
function updateBukang(dt){
  if(phase!=='swim'||overview){bk.on=false;return}
  bk.timer-=dt;
  if(bk.timer<=0){bk.timer=9;bk.on=true;bk.p=0;bk.dir=Math.random()<.5?1:-1;bk.yf=rnd(.38,.72);bk.Z3=cam3.z+rnd(560,860);bk.Y3=rnd(-190,-60)}
  if(bk.say>0)bk.say-=dt;
  bk.X3=-bk.dir*1300+bk.dir*2600*bk.p;
  if(bk.on){bk.p+=dt/7.5*(bk.say>0?.4:1);if(bk.p>=1)bk.on=false}
}
function drawBukang(){
  if(!bk.on)return;const t=diver.t,vw=W/S,vh=H/S;
  const fx=bk.dir>0?-.25+1.5*bk.p:1.25-1.5*bk.p;
  let scx,scy,sk;
  if(mode3&&!overview){const P=project(bk.X3,bk.Y3+Math.sin(t*2)*10,bk.Z3);if(!P)return;scx=P.x;scy=P.y;sk=P.s}
  else{const x=cam.x+fx*vw,y=Math.max(SURFACE+90,cam.y+bk.yf*vh+Math.sin(t*2)*10);scx=(x-cam.x)*S;scy=(y-cam.y)*S;sk=S}
  bk.sx=scx;bk.sy=scy;bk.sk=sk;
  ctx.save();ctx.setTransform(DPR*sk,0,0,DPR*sk,DPR*scx,DPR*scy);
  if(SPR.ready.shark){ctx.save();ctx.scale(bk.dir,1);drawSpr('shark',200,.42,t,0);ctx.restore()}else{
  ctx.save();ctx.scale(bk.dir*1.3,1.3);ctx.rotate(Math.sin(t*6.5)*.05);
  // 꼬리 쪽으로 갈수록 크게 흔들리는 몸통 물결
  const ph=t*4,wv=x=>Math.sin(ph-x*.055)*6*((52-x)/104+.08),Y=(x,y)=>y+wv(x),tsw=Math.cos(ph+48*.055)*.5;
  ctx.save();ctx.translate(-48,Y(-48,0));ctx.rotate(tsw);ctx.fillStyle='#2c3944';ctx.beginPath();ctx.moveTo(4,-4);ctx.quadraticCurveTo(-14,-14,-26,-32);ctx.quadraticCurveTo(-20,-6,-14,0);ctx.quadraticCurveTo(-20,8,-24,22);ctx.quadraticCurveTo(-10,10,4,4);ctx.fill();ctx.restore();
  ctx.fillStyle='#2c3944';ctx.beginPath();ctx.moveTo(-4,Y(-4,-18));ctx.quadraticCurveTo(0,Y(0,-40),10,Y(10,-44));ctx.quadraticCurveTo(10,Y(10,-30),16,Y(16,-18));ctx.fill();
  const bg=ctx.createLinearGradient(0,-24,0,22);bg.addColorStop(0,'#5a6b78');bg.addColorStop(.5,'#3a4855');bg.addColorStop(1,'#26323c');
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(52,Y(52,2));ctx.bezierCurveTo(52,Y(52,-22),24,Y(24,-26),0,Y(0,-22));ctx.bezierCurveTo(-26,Y(-26,-18),-44,Y(-44,-8),-50,Y(-50,0));
  ctx.bezierCurveTo(-44,Y(-44,8),-26,Y(-26,18),0,Y(0,20));ctx.bezierCurveTo(26,Y(26,22),52,Y(52,20),52,Y(52,2));ctx.fill();
  ctx.fillStyle='#eef3f5';ctx.beginPath();ctx.moveTo(48,Y(48,6));ctx.bezierCurveTo(40,Y(40,18),14,Y(14,20),-6,Y(-6,16));ctx.bezierCurveTo(-24,Y(-24,12),-38,Y(-38,6),-46,Y(-46,2));ctx.bezierCurveTo(-20,Y(-20,6),10,Y(10,8),48,Y(48,6));ctx.fill();
  ctx.save();ctx.translate(10,Y(10,12));ctx.rotate(Math.sin(ph+1)*.35);ctx.fillStyle='#2c3944';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-10,18,-18,22);ctx.quadraticCurveTo(-14,8,-16,0);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(10,Y(10,-14),24,4,-.08,0,6.28);ctx.fill();
  ctx.strokeStyle='rgba(20,30,38,.6)';ctx.lineWidth=1.5;[18,22,26].forEach(x0=>{ctx.beginPath();ctx.moveTo(x0,Y(x0,-6));ctx.quadraticCurveTo(x0-2,Y(x0,0),x0,Y(x0,6));ctx.stroke()});
  cuteEye(36,Y(36,-6),6.5);
  ctx.strokeStyle='#14232e';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(34,Y(34,8));ctx.quadraticCurveTo(42,Y(42,13),49,Y(49,8));ctx.stroke();
  ctx.fillStyle='rgba(255,140,150,.6)';ctx.beginPath();ctx.ellipse(32,Y(32,3),4,2,0,0,6.28);ctx.fill();
  // 꼬리 뒤로 기포
  ctx.fillStyle='rgba(230,246,247,.6)';for(let i=0;i<4;i++){const q=(t*1.4+i*.25)%1;ctx.beginPath();ctx.arc(-70-q*40,Y(-48,0)-q*16+Math.sin(i*3)*6,1.5+i*.6,0,6.28);ctx.fill()}
  ctx.restore();}
  if(bk.say>0){const msg='경기도 문화기술의 바다로 놀러와',pop=Math.min(1,(2.8-bk.say)*6);
    // 입(앞쪽 아래) 바로 앞에서 헤엄치는 방향으로 띄움
    const mx=bk.dir*66,my=12;ctx.save();ctx.translate(mx,my);ctx.scale(pop,pop);
    ctx.font='28px "Do Hyeon",sans-serif';const mw=ctx.measureText(msg).width+40,mh=54,bx0=bk.dir>0?16:-16-mw,by0=-mh/2-6;
    ctx.fillStyle='rgba(4,17,28,.25)';ctx.beginPath();ctx.roundRect(bx0+3,by0+4,mw,mh,24);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(bx0,by0,mw,mh,24);ctx.fill();
    ctx.beginPath();ctx.moveTo(bk.dir*20,-12);ctx.lineTo(0,0);ctx.lineTo(bk.dir*22,4);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='#06202e';ctx.fillText(msg,bx0+mw/2,by0+mh/2+10);ctx.restore()}
  ctx.restore();
}

  const fy=WORLD_H-60;
  if(fy<cam.y+H/S+250){ctx.fillStyle='#0b1f22';ctx.beginPath();ctx.moveTo(0,fy);for(let x=0;x<=WORLD_W;x+=40)ctx.lineTo(x,fy+Math.sin(x*.02)*14);ctx.lineTo(WORLD_W,WORLD_H);ctx.lineTo(0,WORLD_H);ctx.fill();
    ctx.strokeStyle='#1f5a45';ctx.lineWidth=5;ctx.lineCap='round';weeds.forEach(w=>{ctx.beginPath();ctx.moveTo(w.x,fy+8);for(let k=1;k<=6;k++)ctx.lineTo(w.x+Math.sin(t*1.2+w.ph+k*.6)*k*3,fy+8-w.h*k/6);ctx.stroke()})}
  ctx.strokeStyle='rgba(230,246,247,.7)';ctx.lineWidth=1;bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.stroke()});
  drawDiverAny();drawFx();
  if(target&&(holding||fast)&&!overview){ctx.strokeStyle='rgba(127,240,214,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(target.x,target.y,14+Math.sin(t*8)*3,0,6.28);ctx.stroke()}
  // 화면 좌표: 눈금, 구역 표지, 기업
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const step=overview?20:5;ctx.fillStyle='rgba(156,195,204,.55)';ctx.font='12px "IBM Plex Sans KR",sans-serif';ctx.textAlign='left';
  for(let m=step;SURFACE+m*PX_PER_M<WORLD_H;m+=step){const yy=(SURFACE+m*PX_PER_M-cam.y)*S;if(yy<-20||yy>H+20)continue;ctx.fillRect(0,yy,(m%(step*2))?6:12,1);if(!overview&&!(m%(step*2)))ctx.fillText(m+'m',16,yy+4)}
  ZONES.forEach(z=>{const zy=(z.top-cam.y)*S;if(zy>H+50||zy<-120)return;
    ctx.strokeStyle=hexA(z.color,.35);ctx.setLineDash([6,10]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,zy);ctx.lineTo(W,zy);ctx.stroke();ctx.setLineDash([]);
    const has=COMPANIES.some(c=>c.z===ZONES.indexOf(z)&&visible(c));ctx.globalAlpha=has?1:.35;
    ctx.textAlign=overview?'left':'center';const lx=overview?16:W/2;ctx.fillStyle=z.color;
    if(overview){}
    else{const k=Math.max(.42,Math.min(1,S/baseZoom())); // 축소한 만큼 글씨·간격도 같이 줄임
      ctx.font=Math.round(Math.max(10,13*k))+'px "IBM Plex Sans KR",sans-serif';ctx.fillText(Math.round((z.top-SURFACE)/PX_PER_M)+'m 구역',lx,zy+Math.round(26*k));
      ctx.font=Math.round(Math.max(12,(W<480?24:30)*k))+'px "Do Hyeon",sans-serif';ctx.fillText(fitLine(z.name,W-32),lx,zy+Math.round((W<480?54:60)*k))}
    ctx.globalAlpha=1});
  COMPANIES.forEach(c=>drawCompany(c,t));
  if(!overview)drawBukang();
  drawFront(t,ccx,ccy,sy);
  if(overview)drawLabels();else labelHits=[];
  if(overview)companions().forEach(e=>{const x=(e.x-cam.x)*S,y=(e.y-cam.y)*S;ctx.globalAlpha=e.a;ctx.fillStyle=e.real?'#ff9a76':'#9cc3cc';ctx.beginPath();ctx.arc(x,y,5,0,6.28);ctx.fill();ctx.globalAlpha=1});
  if(overview){const dx=(diver.x-cam.x)*S,dy=(diver.y-cam.y)*S;ctx.strokeStyle='#ff9a76';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dx,dy,9+Math.sin(t*5)*2,0,6.28);ctx.stroke();
    ctx.fillStyle='#ff9a76';ctx.font='600 11px "IBM Plex Sans KR",sans-serif';ctx.textAlign='center';ctx.fillText('나',dx,dy-14)}
  const dT=overview?.2:Math.min(1,Math.max(0,(diver.y-SURFACE)/(WORLD_H-SURFACE)));
  const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*(.55-.25*dT),W/2,H*.45,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(2,8,14,0)');v.addColorStop(1,`rgba(2,8,14,${.3+.5*dT})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  placeTalk();
}

/* 기업: 유리 구슬 안에서 천천히 도는 3D 메달 */
function drawCompany(c,t){
  const dz=overview?0:Math.sin(c.ph*.45+c.bx)*.09, sx=(c.x-cam.x)*S, sy=(c.y-cam.y)*S, R=Math.max(overview?15:0,c.r*S)*(1+dz);
  if(sx<-200||sx>W+200||sy<-220||sy>H+220)return;
  drawCompanyAt(c,t,sx,sy,R,S);
}
let labelLevel=2;
function drawCompanyAt(c,t,sx,sy,R,k){
  if(!visible(c)){ctx.globalAlpha=.12;ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(sx,sy,R*.7,0,6.28);ctx.fill();ctx.globalAlpha=1;return}
  const isNear=!overview&&near(c), seen=found.has(c.name);
  if(!overview&&labelLevel>0){const kk=Math.min(k,1.25);ctx.strokeStyle=hexA(c.color,.55);ctx.lineWidth=Math.max(1,2*kk);ctx.lineCap='round';
    for(let j=-3;j<=3;j++){ctx.beginPath();ctx.moveTo(sx+j*13*kk,sy+R*.8);
      for(let q=1;q<=5;q++)ctx.lineTo(sx+(j*13+Math.sin(t*2+j+q*.8+c.ph)*6)*kk,sy+R*.8+q*15*kk);ctx.stroke()}
    ctx.lineCap='butt'}
  // 아래로 드리운 그림자 (가까이 올수록 진하고 작게)
  if(!overview){const sh=ctx.createRadialGradient(sx+R*.25,sy+R*2.1,1,sx+R*.25,sy+R*2.1,R*1.1);sh.addColorStop(0,`rgba(0,8,14,.3)`);sh.addColorStop(1,'rgba(0,8,14,0)');
    ctx.fillStyle=sh;ctx.save();ctx.translate(sx+R*.25,sy+R*2.1);ctx.scale(1,.28);ctx.beginPath();ctx.arc(0,0,R*1.1,0,6.28);ctx.restore();ctx.fill()}
  // 발광
  const glow=ctx.createRadialGradient(sx,sy,R*.6,sx,sy,R*(isNear?2.4:1.8));
  glow.addColorStop(0,hexA(c.color,isNear?.4:.2));glow.addColorStop(1,hexA(c.color,0));
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sx,sy,R*2.4,0,6.28);ctx.fill();
  // 유리 구슬 (안쪽 어둡게, 왼쪽 위 빛)
  const gb=ctx.createRadialGradient(sx-R*.35,sy-R*.4,R*.05,sx,sy,R);
  gb.addColorStop(0,'rgba(255,255,255,.32)');gb.addColorStop(.55,hexA(c.color,.22));gb.addColorStop(1,'rgba(2,12,22,.72)');
  ctx.fillStyle=gb;ctx.beginPath();ctx.arc(sx,sy,R,0,6.28);ctx.fill();
  // 회전 메달
  const a=t*.9+c.ph*1.7, cs=Math.cos(a), fw=Math.max(.04,Math.abs(cs)), mr=R*.7, edge=R*.13*Math.sin(a);
  ctx.save();ctx.translate(sx,sy);
  ctx.beginPath();ctx.ellipse(edge,0,mr*fw+Math.abs(edge)*.5,mr,0,0,6.28);ctx.fillStyle=c.color;ctx.fill();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const face=ctx.createLinearGradient(-mr*fw,-mr,mr*fw,mr);
  if(cs>0){face.addColorStop(0,'#ffffff');face.addColorStop(1,'#cfdde2')}else{face.addColorStop(0,c.color);face.addColorStop(1,'#33515e')}
  ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(0,0,mr*fw,mr,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,mr*fw,mr,0,0,6.28);ctx.clip();
  ctx.scale(fw,1);ctx.textAlign='center';ctx.textBaseline='middle';
  if(cs>0){if(c.img){const ar=c.img.width/c.img.height,bw=mr*1.72,bh=mr*1.15;let w=bw,h=bw/ar;if(h>bh){h=bh;w=bh*ar}ctx.drawImage(c.img,-w/2,-h/2,w,h)}
    else{ctx.font=`${Math.round(mr*1.15)}px sans-serif`;ctx.fillText(c.e,0,mr*.06)}}
  else{ctx.fillStyle='#06202e';ctx.font=`${Math.round(mr*1.1)}px "Do Hyeon",sans-serif`;ctx.fillText(c.name[0],0,mr*.06)}
  ctx.restore();ctx.textBaseline='alphabetic';
  // 반사광 + 테두리
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(sx-R*.4,sy-R*.5,R*.26,R*.13,-.6,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(sx+R*.45,sy+R*.38,R*.05,0,6.28);ctx.fill();
  ctx.lineWidth=isNear?4:Math.max(1.5,2.5*k);ctx.strokeStyle=isNear?'#e6f6f7':hexA(c.color,.9);ctx.beginPath();ctx.arc(sx,sy,R,0,6.28);ctx.stroke();
  // 이름
  ctx.textAlign='center';
  if(!overview&&labelLevel>0){const small=k<.45||labelLevel<2,nf=Math.round(Math.max(11,Math.min(22,22*k/.6)));
    ctx.fillStyle='#e6f6f7';ctx.font=nf+'px "Do Hyeon",sans-serif';ctx.fillText(fitLine(c.name,Math.max(60,420*k)),sx,sy-R-(small?6:36));
    if(!small){ctx.fillStyle='rgba(207,230,234,.85)';ctx.font='13px "IBM Plex Sans KR",sans-serif';ctx.fillText(fitLine(c.desc,Math.min(250,360*k)),sx,sy-R-16)}
    if(isNear){const tt=seen?'터치해서 다시 보기':'터치해서 만나기';ctx.font='600 13px "IBM Plex Sans KR",sans-serif';const tw=ctx.measureText(tt).width+16;
      ctx.fillStyle='rgba(4,17,28,.7)';ctx.beginPath();ctx.roundRect(sx-tw/2,sy+R+8,tw,22,11);ctx.fill();ctx.fillStyle=c.color;ctx.fillText(tt,sx,sy+R+24)}}
  if(seen){const mx=sx+R*.72,my=sy-R*.72,mr2=Math.max(6,10*k);ctx.fillStyle='#7ff0d6';ctx.beginPath();ctx.arc(mx,my,mr2,0,6.28);ctx.fill();ctx.strokeStyle='#06202e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx-mr2*.4,my);ctx.lineTo(mx-mr2*.1,my+mr2*.3);ctx.lineTo(mx+mr2*.4,my-mr2*.3);ctx.stroke()}
}


let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;buildSprites(phase==='boat'?18:5);update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
